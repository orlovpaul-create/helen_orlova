name: Build After Movement HQ

on:
  push:
    paths:
      - "_trigger_after.txt"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild After Movement image
        shell: bash
        run: |
          cat tmp_after/part1.txt tmp_after/part2.txt tmp_after/part3.txt tmp_after/part4.txt tmp_after/part5.txt tmp_after/part6.txt > /tmp/after.b64
          base64 -d /tmp/after.b64 > assets/hq/after-movement-v3.webp
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path("assets/hq/after-movement-v3.webp")
          print("size_bytes", p.stat().st_size)
          im=Image.open(p)
          print("dimensions", im.size, "format", im.format)
          assert p.stat().st_size > 25000, p.stat().st_size
          assert im.size == (1086,690), im.size
          assert im.format == "WEBP", im.format
          PY

      - name: Commit rebuilt image
        shell: bash
        run: |
          rm -rf tmp_after
          git config user.name "orlovpaul-create"
          git config user.email "orlovpaul@gmail.com"
          git add assets/hq/after-movement-v3.webp tmp_after
          git commit -m "Rebuild HQ After Movement image"
          git push
