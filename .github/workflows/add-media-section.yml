name: Add Media and Press section

on:
  push:
    paths:
      - "_trigger_media.txt"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Media section and YouTube interview
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Navigation: add Media before CV, once.
          nav_old = '<a href="#projects">Art + Science</a><a href="#cv">CV</a>'
          nav_new = '<a href="#projects">Art + Science</a><a href="#media" data-en="Media" data-ru="СМИ">Media</a><a href="#cv">CV</a>'
          if 'href="#media"' not in s:
              s = s.replace(nav_old, nav_new)

          # Styles for Media / Press section.
          css_marker = '.cv{display:grid;grid-template-columns:.75fr 1.25fr;gap:70px}'
          css_add = '''.mediaGrid{display:grid;grid-template-columns:1.35fr .65fr;gap:36px;align-items:start}.mediaVideo{background:#111;aspect-ratio:16/9;overflow:hidden}.mediaVideo iframe{width:100%;height:100%;border:0;display:block}.mediaCopy{padding-top:6px}.mediaCopy h3{font-size:clamp(2rem,3vw,3.2rem);line-height:1.02;margin:10px 0 18px;font-weight:500}.mediaCopy p{color:#49453f;max-width:520px}.mediaLink{display:inline-block;margin-top:18px;padding:9px 0;border-bottom:1px solid var(--ink);font-size:.85rem}.pressNote{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:.8rem}\n'''
          if '.mediaGrid{' not in s:
              s = s.replace(css_marker, css_add + css_marker)

          # Responsive Media layout.
          responsive_old = '.projects{grid-template-columns:1fr}.work,.work.wide{grid-column:span 6}'
          responsive_new = '.projects{grid-template-columns:1fr}.mediaGrid{grid-template-columns:1fr}.work,.work.wide{grid-column:span 6}'
          if '.mediaGrid{grid-template-columns:1fr}' not in s:
              s = s.replace(responsive_old, responsive_new)

          # Insert Media / Press section immediately before CV.
          if '<section id="media">' not in s:
              media = '''<section id="media"><div class="wrap"><div class="head"><div><div class="eyebrow" data-en="Media & Press" data-ru="СМИ и интервью">Media & Press</div><h2 class="serif" data-en="Media" data-ru="СМИ">Media</h2></div><p data-en="Interviews, publications and media coverage of Elena Orlova’s artistic practice and Art + Science projects." data-ru="Интервью, публикации и упоминания художественной практики Елены Орловой и её проектов Art + Science.">Interviews, publications and media coverage of Elena Orlova’s artistic practice and Art + Science projects.</p></div><article class="mediaGrid"><div class="mediaVideo"><iframe src="https://www.youtube-nocookie.com/embed/dKn8naJx0pk" title="Interview with Elena Orlova" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div><div class="mediaCopy"><div class="eyebrow">YouTube · Interview</div><h3 class="serif" data-en="Interview with Elena Orlova" data-ru="Интервью с Еленой Орловой">Interview with Elena Orlova</h3><p data-en="A video interview featuring Elena Orlova and her artistic practice." data-ru="Видеоинтервью с Еленой Орловой о её художественной практике.">A video interview featuring Elena Orlova and her artistic practice.</p><a class="mediaLink" href="https://www.youtube.com/watch?v=dKn8naJx0pk" target="_blank" rel="noopener" data-en="Watch on YouTube ↗" data-ru="Смотреть на YouTube ↗">Watch on YouTube ↗</a><div class="pressNote" data-en="New interviews, articles and media mentions will be added here." data-ru="Новые интервью, статьи и упоминания в СМИ будут добавляться в этот раздел.">New interviews, articles and media mentions will be added here.</div></div></article></div></section>\n'''
              s = s.replace('<section id="cv">', media + '<section id="cv">')

          p.write_text(s, encoding='utf-8')
          PY

          git config user.name "orlovpaul-create"
          git config user.email "orlovpaul@gmail.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add Media and Press section with YouTube interview"
          git push
