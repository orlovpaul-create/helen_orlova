name: Mobile compatibility fix

on:
  push:
    paths:
      - "_mobile_compatibility_fix.txt"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: python .github/scripts/mobile_patch.py
      - name: Commit changes
        run: |
          git config user.name "orlovpaul-create"
          git config user.email "orlovpaul@gmail.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Improve mobile navigation and iOS Android compatibility"
          git push
