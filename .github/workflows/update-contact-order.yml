name: Update contact links
on:
  push:
    paths:
      - '_trigger_contact.txt'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Telegram contact
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='https://t.me/elenaorl15\" target=\"_blank\" rel=\"noopener\">Telegram · @elenaorl15'
          new='https://t.me/lialenaorl\" target=\"_blank\" rel=\"noopener\">Telegram · @lialenaorl'
          if old not in s:
              raise SystemExit('Telegram contact not found')
          p.write_text(s.replace(old,new,1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Update Telegram contact to lialenaorl"
          git push
