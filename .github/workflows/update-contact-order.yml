name: Update contact links
on:
  push:
    paths:
      - '_trigger_contact.txt'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Telegram contact in both languages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          pattern=r'<a href="https://t\.me/(?:elenaorl15|lialenaorl)" target="_blank" rel="noopener"(?: data-en="[^"]*" data-ru="[^"]*")?>Telegram · @(?:elenaorl15|lialenaorl)</a>'
          replacement='<a href="https://t.me/lialenaorl" target="_blank" rel="noopener" data-en="Telegram · @lialenaorl" data-ru="Telegram · @lialenaorl">Telegram · @lialenaorl</a>'
          new_s, n = re.subn(pattern, replacement, s, count=1)
          if n != 1:
              raise SystemExit('Telegram contact anchor not found')
          p.write_text(new_s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Set Telegram contact to lialenaorl in EN and RU"
          git push
