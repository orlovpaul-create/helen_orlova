name: Fetch Yandex Originals

on:
  push:
    paths:
      - "_trigger_yandex.txt"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download public Yandex Disk folder
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          public_key = "https://disk.yandex.ru/d/cf4MfR5EzLAB1g"
          api = "https://cloud-api.yandex.net/v1/disk/public/resources/download?" + urllib.parse.urlencode({"public_key": public_key})
          with urllib.request.urlopen(api, timeout=60) as r:
              info = json.load(r)
          href = info["href"]
          urllib.request.urlretrieve(href, "yandex_originals.zip")
          print("Downloaded yandex_originals.zip")
          PY
          unzip -l yandex_originals.zip | head -200

      - name: Upload originals archive
        uses: actions/upload-artifact@v4
        with:
          name: yandex-originals
          path: yandex_originals.zip
          retention-days: 1
