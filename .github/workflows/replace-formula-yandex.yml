name: Replace Formula image from Yandex

on:
  push:
    paths:
      - "_replace_formula_yandex.txt"

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Светлый фон.jpg and update site
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request, re
          from pathlib import Path

          public_key = 'https://disk.yandex.ru/d/lNWwPf5elm9axg'
          source_path = '/Объекты фото/Светлый фон.jpg'

          def get_json(url):
              with urllib.request.urlopen(url) as r:
                  return json.load(r)

          dl_api = 'https://cloud-api.yandex.net/v1/disk/public/resources/download?' + urllib.parse.urlencode({
              'public_key': public_key,
              'path': source_path
          })
          href = get_json(dl_api)['href']

          out_dir = Path('assets/hq')
          out_dir.mkdir(parents=True, exist_ok=True)
          jpg_path = out_dir / 'formula-mutual-support-light.jpg'
          urllib.request.urlretrieve(href, jpg_path)

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(
              r'src="assets/hq/formula-mutual-support(?:-v2|-light)?\.(?:webp|jpg)(?:\?v=[^"]*)?"',
              'src="assets/hq/formula-mutual-support-light.jpg?v=20260909-10"',
              s
          )
          s = s.replace('class="contain formula-full" class="formula-full"', 'class="formula-full"')
          s = s.replace('class="contain formula-full"', 'class="formula-full"')
          p.write_text(s, encoding='utf-8')
          PY

          git config user.name "orlovpaul-create"
          git config user.email "orlovpaul@gmail.com"
          git add index.html assets/hq/formula-mutual-support-light.jpg
          git diff --cached --quiet && exit 0
          git commit -m "Replace Formula images with Светлый фон JPG"
          git push
